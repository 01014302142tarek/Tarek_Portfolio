name: Build & Update Public Folder

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-update-public:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --no-tree-shake-icons --base-href "/"

      - name: Clear old public folder & copy new build
        run: |
          rm -rf public
          cp -r build/web public

      - name: Commit & push updated public folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --staged --quiet || git commit -m "chore: update public build [skip ci]"
          git push origin main